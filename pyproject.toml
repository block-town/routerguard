[project]
name = "routerguard"
version = "0.1.0"
description = "Mask secrets outbound, gate tool calls inbound, ledger both: a LiteLLM callback for agents that rent their models through a router"
requires-python = ">=3.9"
readme = "README.md"
license = "MIT"
keywords = ["litellm", "llm", "agent", "security", "proxy", "router", "tool-calls", "secrets"]
dependencies = ["pyyaml"]

[project.optional-dependencies]
litellm = ["litellm"]
test = ["pytest"]

[project.scripts]
leak-audit = "audit.leak_audit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guard", "audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
